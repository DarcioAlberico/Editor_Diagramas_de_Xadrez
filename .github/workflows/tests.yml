# CI da suite de testes (Sprint 5.4).
#
# Windows e a plataforma prioritaria do produto e vem primeiro; Ubuntu entra
# porque e mais barato e pega regressao de caminho/encoding cedo.
#
# Os testes de GUI rodam offscreen (`QT_QPA_PLATFORM=offscreen`), entao nao
# precisam de servidor grafico — no Linux o PySide6 ainda exige as libs de
# sistema que o passo `apt-get` instala.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"

    env:
      QT_QPA_PLATFORM: offscreen
      # Autosave e log ficam dentro do workspace: o runner e descartavel, mas
      # manter o efeito colateral visivel ajuda a depurar uma falha de CI.
      CHESS_PDF_EDITOR_AUTOSAVE_DIR: ${{ github.workspace }}/.ci/autosave
      CHESS_PDF_EDITOR_LOG_DIR: ${{ github.workspace }}/.ci/logs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências de sistema do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Instalar o projeto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Rodar a suíte
        run: python -m pytest -q --junitxml=pytest-report.xml

      - name: Publicar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: ignore
