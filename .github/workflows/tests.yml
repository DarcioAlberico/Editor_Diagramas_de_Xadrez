# CI da suite de testes (Sprint 5.4).
#
# Windows e a plataforma prioritaria do produto e vem primeiro; Ubuntu entra
# porque e mais barato e pega regressao de caminho/encoding cedo.
#
# Os testes de GUI rodam offscreen (`QT_QPA_PLATFORM=offscreen`), entao nao
# precisam de servidor grafico — no Linux o PySide6 ainda exige as libs de
# sistema que o passo `apt-get` instala.
#
# As acoes ficam presas ao **major** (`@v7`), nao a uma versao exata: e assim que
# elas chegam aqui desde o Sprint 5.4, e correcao de patch entra sozinha. Quem
# quiser reprodutibilidade byte a byte troca por SHA — e passa a ter de atualizar
# a mao.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"

    env:
      QT_QPA_PLATFORM: offscreen
      # Autosave e log ficam dentro do workspace: o runner e descartavel, mas
      # manter o efeito colateral visivel ajuda a depurar uma falha de CI.
      CHESS_PDF_EDITOR_AUTOSAVE_DIR: ${{ github.workspace }}/.ci/autosave
      CHESS_PDF_EDITOR_LOG_DIR: ${{ github.workspace }}/.ci/logs

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências de sistema do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Instalar o projeto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Rodar a suíte
        run: python -m pytest -q --junitxml=pytest-report.xml

      - name: Publicar o relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: ignore

  # Sem este job o motor local (Sprint 7) nunca seria exercitado na CI: os testes de
  # `test_local_ocr.py` pulam sozinhos quando torch/OpenCV nao estao instalados, e um
  # skip silencioso passa por verde. Roda so no Ubuntu porque a roda de torch CPU e
  # ~200 MB e o custo nao se justifica duas vezes.
  pytest-local:
    name: pytest com motor local (ubuntu, py3.12)
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen
      CHESS_PDF_EDITOR_AUTOSAVE_DIR: ${{ github.workspace }}/.ci/autosave
      CHESS_PDF_EDITOR_LOG_DIR: ${{ github.workspace }}/.ci/logs

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências de sistema do Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Instalar o projeto com o extra `local`
        run: |
          python -m pip install --upgrade pip
          # Indice CPU: a roda padrao do torch arrasta ~2,5 GB de CUDA que a CI nao usa.
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[local]"
          python -m pip install pytest

      - name: Confirmar que o motor local está de fato disponível
        run: |
          python - <<'PY'
          import sys
          from chess_pdf_editor import local_ocr
          if not local_ocr.available():
              sys.exit(f"motor local indisponivel na CI: {local_ocr.unavailable_reason()}")
          print("motor local pronto:", local_ocr.default_model_path())
          PY

      - name: Rodar a suíte
        run: python -m pytest -q --junitxml=pytest-report.xml

      - name: Publicar o relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-local-ubuntu
          path: pytest-report.xml
          if-no-files-found: ignore
