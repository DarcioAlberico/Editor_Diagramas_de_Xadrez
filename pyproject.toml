[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-pdf-editor"
version = "0.1.0"
description = "Desktop tool to detect, recognize, edit and replace chess diagrams in PDFs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6.0",
  "PyMuPDF>=1.23.0",
  "Pillow>=10.0.0",
  "requests>=2.31.0",
  "python-chess>=1.999",
]

[project.optional-dependencies]
vector = ["cairosvg>=2.7.0"]

[project.scripts]
chess-pdf-editor = "chess_pdf_editor.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
